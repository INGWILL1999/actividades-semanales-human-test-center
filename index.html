<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reporte De Actividades Semanales</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f7fb,#0d1420);--surface:light-dark(#fff,#151e2c);--surface2:light-dark(#f8fafc,#1b2636);--text:light-dark(#162033,#eef3f8);--muted:light-dark(#64748b,#9aa9bc);--border:light-dark(#dbe3ed,#2d3a4d);--accent:#2563eb;--accent2:#1d4ed8;--good:#16a34a}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.app{min-height:100vh;background:var(--bg)}header{padding:28px clamp(18px,4vw,52px) 20px;border-bottom:1px solid var(--border);background:var(--surface)}.head{max-width:1280px;margin:auto;display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{color:var(--accent);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.12em}h1{margin:5px 0 4px;font-size:clamp(26px,4vw,40px)}.subtitle{color:var(--muted);margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}button.primary{background:var(--accent);border-color:var(--accent);color:white}button:hover{background:var(--accent2);color:white}.wrap{max-width:1280px;margin:auto;padding:24px clamp(18px,4vw,52px)}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}.week{font-weight:800;font-size:18px}.filters{display:flex;gap:8px;flex-wrap:wrap}input,select{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:10px 12px;outline:none}input:focus,select:focus{border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(7,minmax(170px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}.day{background:var(--surface);border:1px solid var(--border);border-radius:15px;min-height:430px;overflow:hidden}.dayhead{padding:15px;border-bottom:1px solid var(--border);background:var(--surface2)}.dayname{font-weight:850}.date{font-size:12px;color:var(--muted);margin-top:3px}.tasks{padding:10px}.task{border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:9px;background:var(--surface2)}.tasktime{font-size:11px;color:var(--accent);font-weight:800}.tasktitle{font-weight:700;margin:4px 0}.taskmeta{font-size:11px;color:var(--muted)}.empty{color:var(--muted);font-size:13px;padding:20px 5px;text-align:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}.stat b{display:block;font-size:26px;margin-top:4px}.stat span{font-size:12px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.dialog{width:min(500px,100%);background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px}.dialog h2{margin-top:0}.form{display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{font-size:12px;font-weight:700;color:var(--muted)}.form input,.form select{width:100%;margin-top:5px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(max-width:800px){.grid{grid-template-columns:repeat(7,230px)}.stats{grid-template-columns:repeat(2,1fr)}.head{align-items:flex-start;flex-direction:column}}@media(max-width:430px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}}
@media print{body,.app{background:#fff!important;color:#111!important}.actions,#add,#today,.filters,.task button,.modal{display:none!important}.wrap{max-width:none;padding:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible}.day{min-height:0;break-inside:avoid;border:1px solid #bbb;background:#fff!important}.dayhead,.task,.stat{background:#fff!important;color:#111!important}.stats{grid-template-columns:repeat(4,1fr)}header{padding:12px;border-bottom:2px solid #333;background:#fff!important}.subtitle,.taskmeta,.date,.stat span{color:#444!important}button{display:none!important}}
</style></head>
<body><div class="app" id="app">
<header><div class="head"><div><div class="eyebrow">Área de trabajo</div><h1>TECNOLOGIA DE LA INFORMACIÓN (TI) Y CIBERSEGURIDAD </h1><p class="subtitle">Actividades semanales para planificar, consultar y controlar el trabajo del área.</p></div><div class="actions"><button id="today">Hoy</button><button id="print">Imprimir / Guardar PDF</button><button class="primary" id="add">+ Nueva actividad</button></div></div></header>
<main class="wrap"><div class="toolbar"><div class="week" id="weekLabel"></div><div class="filters"><input id="search" placeholder="Buscar actividad…" aria-label="Buscar actividad"><select id="filter"><option value="all">Todos los días</option></select></div></div>
<section class="stats"><div class="stat"><span>Total de actividades</span><b id="total">0</b></div><div class="stat"><span>Completadas</span><b id="done">0</b></div><div class="stat"><span>Pendientes</span><b id="pending">0</b></div><div class="stat"><span>Progreso semanal</span><b id="progress">0%</b></div></section>
<section class="grid" id="calendar"></section></main>
<div class="modal" id="modal"><div class="dialog"><h2>Nueva actividad</h2><form class="form" id="form"><div><label>Actividad<input id="title" required placeholder="Ej. Revisión de inventario"></label></div><div class="row"><label>Día<select id="day"></select></label><label>Hora<input id="time" type="time" value="09:00"></label></div><div><label>Responsable<input id="owner" placeholder="Nombre del responsable"></label></div><div class="modal-actions"><button type="button" id="cancel">Cancelar</button><button class="primary" type="submit">Guardar actividad</button></div></form></div></div>
<script>
const days=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const defaultTasks=[{title:'Revisión de pendientes',day:0,time:'08:00',owner:'Equipo',done:false},{title:'Seguimiento de actividades',day:1,time:'10:00',owner:'Supervisor',done:false},{title:'Actualización de inventario',day:2,time:'09:00',owner:'Encargado',done:true},{title:'Reunión semanal',day:3,time:'11:00',owner:'Equipo',done:false},{title:'Reporte de avances',day:4,time:'14:00',owner:'Encargado',done:false}];
let tasks=[];
// Base de datos local del navegador (IndexedDB). No requiere instalar programas.
const DB_NAME='HumanTestCenterActividades', STORE='actividades';
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function loadTasks(){try{const db=await openDB();const rows=await new Promise((resolve,reject)=>{const r=db.transaction(STORE,'readonly').objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});if(rows.length){tasks=rows.map(({id,...t})=>t)}else{tasks=defaultTasks.map(t=>({...t}));await saveTasks()}db.close()}catch(err){console.error('No se pudo abrir la base de datos local:',err);try{tasks=JSON.parse(localStorage.getItem('htcTasks')||'null')||defaultTasks.map(t=>({...t}))}catch{tasks=defaultTasks.map(t=>({...t}))}}}
async function saveTasks(){try{const db=await openDB();await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite'),store=tx.objectStore(STORE);store.clear();tasks.forEach(t=>store.add(t));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}catch(err){console.error('Error al guardar; se usará almacenamiento local:',err);localStorage.setItem('htcTasks',JSON.stringify(tasks))}}
const cal=document.querySelector('#calendar'), search=document.querySelector('#search'), filter=document.querySelector('#filter');
days.forEach((d,i)=>{let o=document.createElement('option');o.value=i;o.textContent=d;filter.appendChild(o);let s=document.createElement('option');s.value=i;s.textContent=d;document.querySelector('#day').appendChild(s)});
function render(){let q=search.value.toLowerCase(), f=filter.value;cal.innerHTML='';days.forEach((d,i)=>{if(f!=='all'&&+f!==i)return;let card=document.createElement('article');card.className='day';card.innerHTML=`<div class="dayhead"><div class="dayname">${d}</div><div class="date">Plan semanal</div></div><div class="tasks"></div>`;let box=card.querySelector('.tasks');let list=tasks.filter(t=>t.day===i&&t.title.toLowerCase().includes(q)).sort((a,b)=>a.time.localeCompare(b.time));if(!list.length)box.innerHTML='<div class="empty">Sin actividades</div>';list.forEach(t=>{let idx=tasks.indexOf(t),el=document.createElement('div');el.className='task';el.innerHTML=`<div class="tasktime">${t.time}</div><div class="tasktitle">${t.title}</div><div class="taskmeta">${t.owner||'Sin responsable'}</div><div style="display:flex;gap:6px;margin-top:9px"><button data-done="${idx}" style="padding:5px 8px;font-size:11px">${t.done?'✓ Completada':'Marcar completa'}</button><button data-del="${idx}" style="padding:5px 8px;font-size:11px">Eliminar</button></div>`;box.appendChild(el)});cal.appendChild(card)});updateStats()}
function updateStats(){let total=tasks.length,done=tasks.filter(t=>t.done).length;document.querySelector('#total').textContent=total;document.querySelector('#done').textContent=done;document.querySelector('#pending').textContent=total-done;document.querySelector('#progress').textContent=total?Math.round(done/total*100)+'%':'0%';document.querySelector('#weekLabel').textContent='Semana actual';}
cal.addEventListener('click',e=>{let d=e.target.dataset;if(d.done!==undefined){tasks[+d.done].done=!tasks[+d.done].done;render();saveTasks()}if(d.del!==undefined){tasks.splice(+d.del,1);render();saveTasks()}});search.addEventListener('input',render);filter.addEventListener('change',render);
const modal=document.querySelector('#modal');document.querySelector('#add').onclick=()=>modal.classList.add('show');document.querySelector('#cancel').onclick=()=>modal.classList.remove('show');document.querySelector('#today').onclick=()=>{filter.value='all';search.value='';render()};
document.querySelector('#form').onsubmit=e=>{e.preventDefault();tasks.push({title:document.querySelector('#title').value.trim(),day:+document.querySelector('#day').value,time:document.querySelector('#time').value,owner:document.querySelector('#owner').value.trim(),done:false});e.target.reset();document.querySelector('#time').value='09:00';modal.classList.remove('show');render();saveTasks()};
document.querySelector('#print').onclick=()=>window.print();
loadTasks().then(render);
</script></div></body></html>
